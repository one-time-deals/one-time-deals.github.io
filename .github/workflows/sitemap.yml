name: Auto Update Sitemap

on:
  schedule:
        - cron: '0 3 * * *'  # daily 3am UTC
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
            - uses: actions/checkout@v4
      
            - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
            - name: Install deps
        run: pip install requests beautifulsoup4
      
            - name: Generate sitemap
        run: python generate_sitemap.py
      
            - name: Commit and push
        run: |
          git config user.name "sitemap-bot"
          git config user.email "bot@one-time-deals.github.io"
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update sitemap [skip ci]"
          git push
