  var firstInteractionSent = false;

    return !!(window[ANDROID_BRIDGE_NAME] &&
              typeof window[ANDROID_BRIDGE_NAME].postEvent === 'function');
  }

  function isInIframe() {
    return !!(window.parent && window.parent !== window);
  }

  function sendEvent(eventName, payload) {
    var message = {
      type: eventName,
      payload: payload || {},
      timestamp: Date.now()
    };

    if (hasIOSBridge()) {
      try {
        window.webkit.messageHandlers[HANDLER_NAME].postMessage(message);
      } catch (e) { /* ignore */ }

        eventName,
        JSON.stringify(p)

    } catch (e) { /* ignore */ }
    return;
  }

    if (isInIframe()) {
      try {
        window.parent.postMessage(message, '*');
      } catch (e) { /* ignore */ }
      return;
    }
  }

  // --- rAF Game-Ready Detection ---

  function onFrame() {
    if (gameReadySent) return;

    frameCount++;
    if (frameCount >= RAF_FRAME_THRESHOLD) {
      gameReadySent = true;
      sendEvent('game_ready', {
        frame_count: frameCount,
        detected_at: Date.now()
      });
      return;
    }

    originalRAF.call(window, onFrame);
  }

  if (originalRAF) {
    window.requestAnimationFrame = function(callback) {
      if (!gameReadySent) {
        return originalRAF.call(window, function(timestamp) {
          frameCount++;

            gameReadySent = true;
            sendEvent('game_ready', {

              detected_at: Date.now()

      return originalRAF.call(window, callback);

      sendEvent('user_interaction_start', null);

      for (var i = 0; i < events.length; i++) {
        document.removeEventListener(events[i], onFirstInteraction, true);
      }
    }

    for (var i = 0; i < events.length; i++) {

    }

      errorSent = true;

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Time Deals — Auto-Discovered Posts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#faf8f4;color:#1a1208}
:root{--ink:#1a1208;--muted:#7a6e5e;--fire:#e8440a;--fire-soft:rgba(232,68,10,.1);--rule:#d6cdb8;--card:#fff;--warm:#f2ede4}
header{background:var(--ink);color:#faf8f4;border-bottom:3px solid var(--fire);position:sticky;top:0;z-index:10}
.header-inner{max-width:1240px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center}
.brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
.brand-mark{width:40px;height:40px;background:var(--fire);border-radius:8px;display:grid;place-items:center;font-family:'DM Serif Display',serif}
.brand-name{font-family:'DM Serif Display',serif;font-size:20px}
main{max-width:1240px;margin:0 auto;padding:40px 24px}
h1{font-family:'DM Serif Display',serif;font-size:32px;margin-bottom:8px}
.subtitle{color:var(--muted);margin-bottom:24px}
.status{background:var(--fire-soft);border:1px solid rgba(232,68,10,.2);padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:24px;display:flex;gap:10px;align-items:center}
.posts-grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:.2s;text-decoration:none;color:inherit}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.12)}
.thumb{aspect-ratio:16/9;background:var(--warm);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta{display:flex;gap:8px;font-size:12px;color:var(--muted);align-items:center}
.source{font-family:'JetBrains Mono',monospace;color:var(--fire);font-weight:700;font-size:11px}
.title{font-family:'DM Serif Display',serif;font-size:18px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.excerpt{font-size:13px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.footer{margin-top:auto;padding-top:10px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.badge{background:var(--ink);color:white;padding:3px 8px;border-radius:999px;font-size:10px;font-family:'JetBrains Mono',monospace}
.spinner{width:18px;height:18px;border:2.5px solid var(--rule);border-top-color:var(--fire);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a class="brand" href="#">
      <div class="brand-mark">OTD</div>
      <div class="brand-name">One Time Deals</div>
    </a>
  </div>
</header>

<main>
  <h1>Latest Posts</h1>
  <p class="subtitle">Automatically discovering all .html pages in your repo</p>
  
  <div class="status" id="status">
    <div class="spinner"></div>
    <span>Scanning GitHub repo for .html files...</span>
  </div>

  <div id="grid" class="posts-grid"></div>
  <div id="empty" class="empty" style="display:none"></div>
</main>

<script>
// ========== CONFIG ==========
const REPO_OWNER = 'one-time-deals';
const REPO_NAME = 'one-time-deals.github.io';
const EXCLUDE = ['index.html','404.html','index.htm'];
// ============================

async function discoverHtmlFiles(){
  try{
    // Try GitHub API first
    const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`;
    const res = await fetch(apiUrl);
    if(!res.ok) throw new Error('API failed');
    const files = await res.json();
    
    return files
      .filter(f => f.type === 'file' && f.name.toLowerCase().endsWith('.html') && !EXCLUDE.includes(f.name.toLowerCase()))
      .map(f => f.name)
      .sort();
  }catch(e){
    console.warn('GitHub API failed, falling back to sitemap', e);
    // Fallback: try sitemap.xml
    try{
      const s = await fetch('/sitemap.xml');
      const txt = await s.text();
      const urls = [...txt.matchAll(/<loc>([^<]+\.html)<\/loc>/gi)].map(m=>m[1]);
      return urls.map(u => new URL(u).pathname.replace(/^\//,'')).filter(n=>!EXCLUDE.includes(n));
    }catch{
      // Last fallback: manual list
      return ['spy-academy-review.html'];
    }
  }
}

async function scrape(url){
  try{
    const res = await fetch(url, {cache:'no-store'});
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const text = doc.body.textContent || '';
    
    const title = doc.querySelector('meta[property="og:title"]')?.content ||
                  doc.querySelector('h1')?.textContent?.trim() ||
                  doc.title.split('—')[0].trim() ||
                  url.replace('.html','').replace(/-/g,' ');
    
    let excerpt = doc.querySelector('meta[name="description"]')?.content || '';
    if(!excerpt){
      const p = [...doc.querySelectorAll('p')].find(p=>p.textContent.trim().length>60);
      excerpt = p ? p.textContent.trim().slice(0,170)+'…' : '';
    }
    if(url.includes('spy-academy')){
      const m = text.match(/An honest[^\.]{20,200}\./);
      if(m) excerpt = m[0];
    }
    
    let img = doc.querySelector('meta[property="og:image"]')?.content || doc.querySelector('img')?.src || '';
    if(img && !img.startsWith('http')) img = new URL(img, new URL(url, location.href)).href;
    if(!img) img = 'https://images.unsplash.com/photo-1555949963-aa79dcee981c?w=1200&q=80';
    
    const authorMatch = text.match(/✍️\s*([A-Za-z ]{3,30})/);
    const source = authorMatch ? authorMatch[1].trim() : (doc.querySelector('meta[name="author"]')?.content || 'One Time Deals');
    
    const dateMatch = text.match(/Updated:\s*([A-Za-z]+ \d{1,2},? \d{4}|[A-Za-z]+ \d{4})/);
    const date = dateMatch ? new Date(dateMatch[1]).toISOString().split('T')[0] : '';
    
    return {url, title, excerpt, image:img, source, date};
  }catch(e){
    return null;
  }
}

function card(p){
  const d = p.date ? new Date(p.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
  return `<a class="card" href="${p.url}">
    <div class="thumb"><img src="${p.image}" alt="" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1555949963-aa79dcee981c?w=800'"></div>
    <div class="body">
      <div class="meta"><span class="source">${p.source}</span>${d?`<span>•</span><span>${d}</span>`:''}</div>
      <h3 class="title">${p.title}</h3>
      <p class="excerpt">${p.excerpt}</p>
      <div class="footer"><span class="badge">.html</span><span>${p.url}</span></div>
    </div>
  </a>`;
}

async function init(){
  const status = document.getElementById('status');
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  
  const files = await discoverHtmlFiles();
  
  if(!files.length){
    status.innerHTML = '❌ No .html files found';
    empty.style.display = 'block';
    empty.textContent = 'Add .html files to your repo root';
    return;
  }
  
  status.innerHTML = `<div class="spinner"></div><span>Found ${files.length} pages — scraping metadata...</span>`;
  
  const posts = (await Promise.all(files.map(scrape))).filter(Boolean);
  
  status.style.display = 'none';
  
  if(!posts.length){
    empty.style.display = 'block';
    empty.textContent = 'Could not scrape any pages';
    return;
  }
  
  // Sort newest first
  posts.sort((a,b)=> new Date(b.date||0) - new Date(a.date||0));
  
  grid.innerHTML = posts.map(card).join('');
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
